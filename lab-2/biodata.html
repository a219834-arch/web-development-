<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biodata</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #1ed760;
            --green-hover: #3be477;
            --panel: #121212;
            --card: #181818;
            --card-hover: #282828;
            --subdued: #b3b3b3;
            --accent: #8d67ab;   /* same purple as hi.html / contact.html */
            --tint: #3b2a5a;
            --font: "Circular Std", "Spotify Mix", "Figtree", "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { color-scheme: dark; }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--tint) 0, #1b1429 220px, var(--panel) 420px);
            background-color: var(--panel);
            color: #fff;
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            padding: 32px;
        }

        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        .wrap { max-width: 900px; margin: 0 auto; }

        /* ---------- HEADER ---------- */

        .head { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 32px; }

        .cover {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            border-radius: 4px;
            background: var(--accent);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 64px;
            box-shadow: 0 4px 60px rgba(0, 0, 0, .5);
        }

        .head .kind { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .head h1 {
            font-size: clamp(32px, 6vw, 64px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.03em;
            margin-bottom: 14px;
        }
        .head .meta { font-size: 14px; color: #ffffffcc; }
        .head .meta strong { color: #fff; font-weight: 700; }

        .intro { color: #e6e6e6; font-size: 16px; line-height: 1.7; max-width: 70ch; margin-bottom: 28px; }

        /* ---------- SECTIONS + PANELS ---------- */

        .section { margin-bottom: 32px; }
        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }

        .panel {
            background: var(--card);
            border-radius: 8px;
            padding: 20px;
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }
        .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .field.full { grid-column: 1 / -1; }

        .label {
            font-size: 12px;
            font-weight: 700;
            color: var(--subdued);
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        /* ---------- INPUTS ---------- */

        input[type="text"], input[type="number"], input[type="email"], input[type="date"],
        input[type="tel"], input[type="url"], input[type="file"], textarea, select {
            width: 100%;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 16px;
            transition: background .2s, border-color .2s, box-shadow .2s;
        }
        input:hover, textarea:hover, select:hover { background: #303030; }
        input:focus, textarea:focus, select:focus {
            outline: none;
            background: #303030;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #8d67ab55;
        }
        input:user-invalid, textarea:user-invalid, select:user-invalid { border-color: #e8115b; }

        ::placeholder { color: #8a8a8a; }
        textarea { resize: vertical; min-height: 110px; }
        select option { background: #282828; color: #fff; }

        /* radio buttons as pills */
        .choices { display: flex; gap: 10px; flex-wrap: wrap; }
        .choice { position: relative; }
        .choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
        .choice label {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 999px;
            background: #2a2a2a;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }
        .choice input:hover + label { background: #3a3a3a; }
        .choice input:checked + label { background: var(--green); color: #000; }
        .choice input:focus-visible + label { outline: 2px solid #fff; outline-offset: 2px; }

        /* height slider */
        .range-row { display: flex; align-items: center; gap: 16px; }
        input[type="range"] { flex: 1; accent-color: var(--green); height: 24px; cursor: pointer; }
        .range-val { min-width: 74px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

        /* colour picker */
        input[type="color"] {
            width: 72px;
            height: 46px;
            padding: 4px;
            background: #2a2a2a;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }

        /* file picker */
        input[type="file"] { padding: 8px; }
        input[type="file"]::file-selector-button {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 999px;
            padding: 8px 18px;
            margin-right: 14px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        /* ---------- BUTTONS ---------- */

        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 8px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            border-radius: 999px;
            padding: 14px 32px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .1s, background .2s, border-color .2s;
        }
        .btn:hover { transform: scale(1.04); }
        .btn.primary { background: var(--green); color: #000; }
        .btn.primary:hover { background: var(--green-hover); }
        .btn.ghost { background: none; color: #fff; border: 1px solid #727272; }
        .btn.ghost:hover { border-color: #fff; }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 640px) {
            body { padding: 20px 16px; }
            .head { flex-direction: column; align-items: flex-start; gap: 16px; }
            .cover { width: 100px; height: 100px; font-size: 44px; }
            .fields { grid-template-columns: 1fr; }
            .panel { padding: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="wrap">

        <header class="head">
            <div class="cover" aria-hidden="true"><i class="bi bi-person-vcard-fill"></i></div>
            <div>
                <p class="kind">Page</p>
                <h1>Biodata Form</h1>
                <p class="meta"><strong>Muhammad Haris Syahmi</strong> • A219834 • Lab 2: HTML Forms</p>
            </div>
        </header>

        <p class="intro">Please fill in every field below, then press <strong>Submit My Biodata</strong>.</p>

        <form action="http://lrgs.ftsm.ukm.my/users/a123456/lab-2/validate_biodata.php" method="post" enctype="multipart/form-data" target="_blank"
              onreset="setTimeout(function () { outputID.value = heightId.value; }, 0)">

            <!-- Personal details -->
            <section class="section">
                <h2 class="section-title">Personal details</h2>
                <div class="panel fields">

                    <div class="field">
                        <label class="label" for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Insert your name" autofocus required>
                    </div>

                    <div class="field">
                        <label class="label" for="age">Age</label>
                        <input type="number" id="age" name="age" min="0" max="100" step="1" required>
                    </div>

                    <div class="field">
                        <span class="label" id="genderLabel">Gender</span>
                        <div class="choices" role="radiogroup" aria-labelledby="genderLabel">
                            <div class="choice">
                                <input type="radio" name="gender" id="male" value="male" checked required>
                                <label for="male">Male</label>
                            </div>
                            <div class="choice">
                                <input type="radio" name="gender" id="female" value="female" required>
                                <label for="female">Female</label>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label" for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="field full">
                        <label class="label" for="heightId">Height</label>
                        <div class="range-row">
                            <input type="range" name="height" id="heightId" min="100" max="200" value="150" oninput="outputID.value = heightId.value" required>
                            <span class="range-val"><output id="outputID">150</output> cm</span>
                        </div>
                    </div>

                </div>
            </section>

            <!-- Contact -->
            <section class="section">
                <h2 class="section-title">Contact</h2>
                <div class="panel fields">

                    <div class="field full">
                        <label class="label" for="address">Address</label>
                        <textarea id="address" name="address" cols="50" rows="5" placeholder="Insert your address" required></textarea>
                    </div>

                    <div class="field">
                        <label class="label" for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Insert your email" required pattern=".*ukm.*" title="Please use your UKM email address">
                    </div>

                    <div class="field">
                        <label class="label" for="phone">Tel</label>
                        <input type="tel" id="phone" name="phone" placeholder="+60##-#######" required pattern="(\+60|0060).*" title="Start with +60 or 0060">
                    </div>

                    <div class="field full">
                        <label class="label" for="fbtwig">Fb / TW / IG</label>
                        <input type="url" id="fbtwig" name="fbtwig" placeholder="Insert the URL" required>
                    </div>

                </div>
            </section>

            <!-- More about me -->
            <section class="section">
                <h2 class="section-title">More about me</h2>
                <div class="panel fields">

                    <div class="field">
                        <label class="label" for="color">My Favorite Color</label>
                        <input type="color" id="color" name="color" value="#008000" required>
                    </div>

                    <div class="field">
                        <label class="label" for="university">My University</label>
                        <select id="university" name="university" required>
                            <option value="">Select</option>
                            <option value="UKM" selected>Universiti Kebangsaan Malaysia</option>
                            <option value="UM">Universiti Malaya</option>
                            <option value="UPM">Universiti Putra Malaysia</option>
                            <option value="USM">Universiti Sains Malaysia</option>
                            <option value="UTM">Universiti Teknologi Malaysia</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label class="label" for="photo">My Face Photo</label>
                        <input type="file" id="photo" name="photo" accept="image/*" required>
                    </div>

                </div>
            </section>

            <input type="hidden" name="matricnum" value="a219834">

            <div class="actions">
                <button type="submit" name="biodata_form" value="Submit My Biodata" class="btn primary">
                    <i class="bi bi-send-fill"></i> Submit My Biodata
                </button>
                <button type="reset" class="btn ghost">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
            </div>

        </form>

    </div>
</body>
</html>
