<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Me</title>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Figtree: free font closest to Spotify's Circular -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #1ed760;
            --green-hover: #3be477;
            --panel: #121212;
            --card: #181818;
            --card-hover: #282828;
            --subdued: #b3b3b3;
            --font: "Circular Std", "Spotify Mix", "Figtree", "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #3b2a5a 0, #1b1429 220px, var(--panel) 420px);
            background-color: var(--panel);
            color: #fff;
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            padding: 32px;
        }

        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        .wrap { max-width: 900px; margin: 0 auto; }

        /* ---------- HEADER ---------- */

        .head { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 32px; }

        .cover {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            border-radius: 4px;
            background: #8d67ab;
            display: grid;
            place-items: center;
            font-size: 64px;
            box-shadow: 0 4px 60px rgba(0, 0, 0, .5);
        }

        .head .kind { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .head h1 {
            font-size: clamp(32px, 6vw, 64px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.03em;
            margin-bottom: 14px;
        }
        .head .meta { font-size: 14px; color: #ffffffcc; }
        .head .meta strong { color: #fff; font-weight: 700; }

        /* ---------- CONTACT CARDS ---------- */

        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }

        .cards { display: grid; gap: 12px; }

        .card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--card);
            border-radius: 8px;
            transition: background .25s;
        }
        .card:hover { background: var(--card-hover); }

        .card-link {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .icon {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 24px;
            color: #000;
        }
        .icon.email { background: #1ed760; }
        .icon.phone { background: #509bf5; }
        .icon.insta { background: linear-gradient(45deg, #f9a825, #e8115b 55%, #8d67ab); color: #fff; }

        .info { min-width: 0; }
        .label { font-size: 12px; font-weight: 700; color: var(--subdued); text-transform: uppercase; letter-spacing: .08em; }
        .value { font-size: 18px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
        .card:hover .value { color: var(--green); }

        .copy {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid #727272;
            border-radius: 999px;
            background: none;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: border-color .2s, transform .1s;
        }
        .copy:hover { border-color: #fff; transform: scale(1.04); }

        .note { margin-top: 28px; color: var(--subdued); font-size: 14px; }

        /* ---------- TOAST ---------- */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 12px);
            background: #2e77d0;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 640px) {
            body { padding: 20px 16px; }
            .head { flex-direction: column; align-items: flex-start; gap: 16px; }
            .cover { width: 100px; height: 100px; font-size: 44px; }
            .card { flex-wrap: wrap; }
            .copy { margin-left: 72px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="wrap">

        <header class="head">
            <div class="cover" aria-hidden="true"><i class="bi bi-envelope-fill"></i></div>
            <div>
                <p class="kind">Page</p>
                <h1>Contact Me</h1>
                <p class="meta"><strong>Muhammad Haris Syahmi</strong> • A219834 • 3 ways to reach me</p>
            </div>
        </header>

        <h2 class="section-title">Get in touch</h2>

        <section class="cards">

            <!-- Email -->
            <div class="card">
                <a class="card-link" href="mailto:a219834@siswa.ukm.edu.my" target="_blank" rel="noopener">
                    <span class="icon email"><i class="bi bi-envelope-fill"></i></span>
                    <span class="info">
                        <span class="label">Email</span>
                        <span class="value">a219834@siswa.ukm.edu.my</span>
                    </span>
                </a>
                <button type="button" class="copy" data-copy="a219834@siswa.ukm.edu.my">
                    <i class="bi bi-clipboard"></i> Copy
                </button>
            </div>

            <!-- Phone -->
            <div class="card">
                <a class="card-link" href="tel:+60162913934">
                    <span class="icon phone"><i class="bi bi-telephone-fill"></i></span>
                    <span class="info">
                        <span class="label">Phone</span>
                        <span class="value">016-291 3934</span>
                    </span>
                </a>
                <button type="button" class="copy" data-copy="016-291 3934">
                    <i class="bi bi-clipboard"></i> Copy
                </button>
            </div>

            <!-- Instagram -->
            <div class="card">
                <a class="card-link" href="https://www.instagram.com/hrisyhmi/" target="_blank" rel="noopener">
                    <span class="icon insta"><i class="bi bi-instagram"></i></span>
                    <span class="info">
                        <span class="label">Instagram</span>
                        <span class="value">@hrisyhmi</span>
                    </span>
                </a>
                <button type="button" class="copy" data-copy="@hrisyhmi">
                    <i class="bi bi-clipboard"></i> Copy
                </button>
            </div>

        </section>

        <p class="note">Feel free to message me anytime. I'll reply as soon as I can.</p>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        const toast = document.getElementById('toast');
        let toastTimer = null;

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Works on https and on plain http (older fallback)
        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise((resolve, reject) => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy') ? resolve() : reject(); }
                catch (err) { reject(err); }
                document.body.removeChild(ta);
            });
        }

        document.querySelectorAll('.copy').forEach(btn => {
            btn.addEventListener('click', () => {
                copyText(btn.dataset.copy)
                    .then(() => showToast('Copied: ' + btn.dataset.copy))
                    .catch(() => showToast("Couldn't copy. Please copy it manually."));
            });
        });
    </script>
</body>
</html>
