<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Computing Skills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #1ed760;
            --panel: #121212;
            --card: #181818;
            --card-hover: #282828;
            --subdued: #b3b3b3;
            --accent: #8d67ab;   /* same purple as contact.html */
            --tint: #3b2a5a;     /* same purple as contact.html */
            --font: "Circular Std", "Spotify Mix", "Figtree", "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--tint) 0, #1b1429 220px, var(--panel) 420px);
            background-color: var(--panel);
            color: #fff;
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            padding: 32px;
        }

        a { color: inherit; text-decoration: none; }
        :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        .wrap { max-width: 900px; margin: 0 auto; }

        /* ---------- HEADER ---------- */

        .head { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 32px; }

        .cover {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            border-radius: 4px;
            background: var(--accent);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 64px;
            box-shadow: 0 4px 60px rgba(0, 0, 0, .5);
        }

        .head .kind { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .head h1 {
            font-size: clamp(32px, 6vw, 64px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.03em;
            margin-bottom: 14px;
        }
        .head .meta { font-size: 14px; color: #ffffffcc; }
        .head .meta strong { color: #fff; font-weight: 700; }

        /* ---------- SECTIONS ---------- */

        .section { margin-bottom: 36px; }
        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }

        .about p {
            font-size: 16px;
            line-height: 1.7;
            color: #e6e6e6;
            max-width: 70ch;
        }
        .about p + p { margin-top: 12px; }

        /* ---------- INFO CARDS (rows with icon) ---------- */

        .cards { display: grid; gap: 12px; }

        .card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--card);
            border-radius: 8px;
            transition: background .25s;
        }
        .card:hover { background: var(--card-hover); }

        .icon {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            display: grid;
            place-items: center;
            font-size: 24px;
        }

        .icon.green { background: #1ed760; }
        .icon.blue  { background: #509bf5; }
        .icon.pink  { background: linear-gradient(45deg, #f9a825, #e8115b 55%, #8d67ab); color: #fff; }

        .info { min-width: 0; }
        .label { font-size: 12px; font-weight: 700; color: var(--subdued); text-transform: uppercase; letter-spacing: .08em; }
        .value { font-size: 18px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }

        /* ---------- TAGS ---------- */

        .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag {
            padding: 8px 16px;
            background: #ffffff1a;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            transition: background .2s;
        }
        .tag:hover { background: #ffffff33; }
        .tag i { margin-right: 6px; color: var(--accent); }

        /* ---------- ITEM GRID (places) ---------- */

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }

        .item {
            background: var(--card);
            border-radius: 8px;
            padding: 16px;
            transition: background .25s;
        }
        .item:hover { background: var(--card-hover); }

        .item-art {
            position: relative;
            aspect-ratio: 1;
            border-radius: 6px;
            background: var(--accent);
            color: #000;
            display: grid;
            place-items: center;
            font-size: 48px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
        }
        .item-art img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .item-sub { font-size: 14px; color: var(--subdued); line-height: 1.4; }

        /* ---------- SKILL BARS ---------- */

        .skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px 32px; }
        .skill-top { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; }
        .skill-top span:last-child { color: var(--subdued); font-weight: 500; font-variant-numeric: tabular-nums; }
        .bar { height: 8px; background: #4d4d4d; border-radius: 4px; overflow: hidden; }
        .fill {
            height: 100%;
            width: var(--w);
            background: var(--green);
            border-radius: 4px;
            animation: grow .9s ease-out;
        }
        @keyframes grow { from { width: 0; } }

        /* ---------- TRACKLIST (media) ---------- */

        .tracks { display: grid; gap: 2px; }

        .track {
            display: grid;
            grid-template-columns: 32px 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background .2s;
        }
        .track:hover { background: #ffffff1a; }
        .track .num { color: var(--subdued); text-align: right; font-variant-numeric: tabular-nums; }
        .track:hover .num { color: var(--green); }

        .t-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .t-art {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 4px;
            background: var(--accent);
            color: #000;
            display: grid;
            place-items: center;
            font-size: 18px;
        }
        .t-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .t-sub { font-size: 14px; color: var(--subdued); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .t-type { font-size: 13px; color: var(--subdued); }

        .note { margin-top: 8px; color: var(--subdued); font-size: 14px; }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 640px) {
            body { padding: 20px 16px; }
            .head { flex-direction: column; align-items: flex-start; gap: 16px; }
            .cover { width: 100px; height: 100px; font-size: 44px; }
            .track { grid-template-columns: 24px 1fr; padding: 8px; gap: 12px; }
            .t-type { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="wrap">

        <header class="head">
            <div class="cover" aria-hidden="true"><i class="bi bi-code-slash"></i></div>
            <div>
                <p class="kind">Page</p>
                <h1>My Computing Skills</h1>
                <p class="meta"><strong>Muhammad Haris Syahmi</strong> • A219834 • What I can build</p>
            </div>
        </header>

        <!--
            EDIT: change the skill names and the percentage.
            Change the number in style="--w:90%" and the number shown on the right.
        -->
        <section class="section">
            <h2 class="section-title">Programming &amp; web</h2>
            <div class="skills">

                <div class="skill">
                    <div class="skill-top"><span>HTML5</span><span>90%</span></div>
                    <div class="bar"><div class="fill" style="--w:90%"></div></div>
                </div>

                <div class="skill">
                    <div class="skill-top"><span>CSS3</span><span>85%</span></div>
                    <div class="bar"><div class="fill" style="--w:85%"></div></div>
                </div>

                <div class="skill">
                    <div class="skill-top"><span>JavaScript</span><span>75%</span></div>
                    <div class="bar"><div class="fill" style="--w:75%"></div></div>
                </div>

                <div class="skill">
                    <div class="skill-top"><span>PHP</span><span>60%</span></div>
                    <div class="bar"><div class="fill" style="--w:60%"></div></div>
                </div>

                <div class="skill">
                    <div class="skill-top"><span>MySQL</span><span>50%</span></div>
                    <div class="bar"><div class="fill" style="--w:50%"></div></div>
                </div>

                <div class="skill">
                    <div class="skill-top"><span>Responsive design</span><span>80%</span></div>
                    <div class="bar"><div class="fill" style="--w:80%"></div></div>
                </div>

            </div>
        </section>

        <!-- EDIT: add or remove tools -->
        <section class="section">
            <h2 class="section-title">Tools I use</h2>
            <div class="tags">
                <span class="tag"><i class="bi bi-code-square"></i>VS Code</span>
                <span class="tag"><i class="bi bi-hdd-network-fill"></i>Laragon</span>
                <span class="tag"><i class="bi bi-cloud-upload-fill"></i>FileZilla</span>
                <span class="tag"><i class="bi bi-bootstrap-fill"></i>Bootstrap Icons</span>
                <span class="tag"><i class="bi bi-github"></i>Git &amp; GitHub</span>
                <span class="tag"><i class="bi bi-microsoft"></i>Microsoft Office</span>
            </div>
        </section>

    </div>
</body>
</html>
